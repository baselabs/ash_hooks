name: Exact BEAM runtime
description: >-
  Installs the Elixir and OTP versions a .tool-versions file names, exactly, and
  refuses the job when the installed runtime differs.
inputs:
  elixir:
    description: Elixir version as .tool-versions names it, such as 1.20.5-otp-29.
    required: true
  otp:
    description: OTP version as .tool-versions names it, such as 29.1.2.
    required: true
runs:
  using: composite
  steps:
    - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
      with:
        elixir-version: ${{ inputs.elixir }}
        otp-version: ${{ inputs.otp }}
        version-type: strict
    - name: Refuse a runtime other than .tool-versions names
      shell: bash
      env:
        WANT_ELIXIR: ${{ inputs.elixir }}
        WANT_OTP: ${{ inputs.otp }}
      run: |
        elixir -e '
          otp_file = Path.join([to_string(:code.root_dir()), "releases", System.otp_release(), "OTP_VERSION"])
          installed = {"#{System.version()}-otp-#{System.build_info()[:otp_release]}", String.trim(File.read!(otp_file))}
          wanted = {System.fetch_env!("WANT_ELIXIR"), System.fetch_env!("WANT_OTP")}
          if installed != wanted do
            IO.puts(:stderr, "installed Elixir #{elem(installed, 0)} on OTP #{elem(installed, 1)}; .tool-versions names Elixir #{elem(wanted, 0)} on OTP #{elem(wanted, 1)}")
            System.halt(1)
          end
          IO.puts("Elixir #{elem(installed, 0)} on OTP #{elem(installed, 1)}, as .tool-versions names")
        '
