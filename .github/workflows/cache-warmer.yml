name: Cache warmer

# The one writer of the caches CI restores. A cache saved on the default branch
# can be restored by every qualification ref; one saved on a kci/<sha> ref only
# by that ref. Each job builds one key that ci.yml restores, on the same paths,
# from the committed lock, and skips the build when the key already exists.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cache-warmer
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  toolchain:
    name: Read runtime toolchains
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # the five-minute floor; the slowest green was 10s on run 44197885333
    outputs:
      elixir: ${{ steps.toolchain.outputs.elixir }}
      otp: ${{ steps.toolchain.outputs.otp }}
      test_matrix: ${{ steps.toolchain.outputs.test_matrix }}
    steps:
      - name: Refuse any ref but the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "$DEFAULT_BRANCH" ] || [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::The cache warmer runs only on the default branch; this run is on $GITHUB_REF."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
        id: toolchain

  # One test build per lane: checks and test restore every lane, and the
  # PostgreSQL and Dialyzer jobs restore the default lane, which therefore also
  # carries the PLTs.
  test:
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 11 # twice the slowest green, 314s (default lane, PLTs) on run 44196835879
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.toolchain.outputs.test_matrix) }}
    env:
      MIX_ENV: test
      ASH_HOOKS_NO_OPTIONAL: ${{ matrix.no_optional }}
      KEY: test-${{ matrix.elixir }}-${{ matrix.otp }}-noopt-${{ matrix.no_optional }}
      DEFAULT_LANE: ${{ matrix.elixir == needs.toolchain.outputs.elixir && matrix.otp == needs.toolchain.outputs.otp && matrix.no_optional != '1' }}
    steps:
      - name: Refuse any ref but the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "$DEFAULT_BRANCH" ] || [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::The cache warmer runs only on the default branch; this run is on $GITHUB_REF."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: lookup
        with:
          path: |
            deps
            _build
          key: ${{ env.KEY }}-${{ hashFiles('mix.lock') }}
          lookup-only: true
      - if: steps.lookup.outputs.cache-hit != 'true'
        uses: ./.github/actions/beam
        with:
          elixir: ${{ matrix.elixir }}
          otp: ${{ matrix.otp }}
      - if: steps.lookup.outputs.cache-hit != 'true'
        run: mix deps.get --check-locked
      - if: steps.lookup.outputs.cache-hit != 'true'
        run: mix compile --warnings-as-errors
      - name: Build the PLTs (default lane)
        if: steps.lookup.outputs.cache-hit != 'true' && env.DEFAULT_LANE == 'true'
        run: mix dialyzer --plt
      - if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ env.KEY }}-${{ hashFiles('mix.lock') }}

  floor:
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # the five-minute floor; the slowest green was 115s on run 44196835879
    env:
      MIX_ENV: test
    steps:
      - name: Refuse any ref but the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "$DEFAULT_BRANCH" ] || [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::The cache warmer runs only on the default branch; this run is on $GITHUB_REF."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the floor toolchain
        id: versions
        run: sh scripts/toolchain.sh ci/floor/.tool-versions >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: lookup
        with:
          path: |
            deps
            _build
          key: floor-${{ steps.versions.outputs.elixir }}-${{ steps.versions.outputs.otp }}-${{ hashFiles('mix.lock') }}
          lookup-only: true
      - if: steps.lookup.outputs.cache-hit != 'true'
        uses: ./.github/actions/beam
        with:
          elixir: ${{ steps.versions.outputs.elixir }}
          otp: ${{ steps.versions.outputs.otp }}
      - if: steps.lookup.outputs.cache-hit != 'true'
        run: mix deps.get --check-locked
      - if: steps.lookup.outputs.cache-hit != 'true'
        run: mix compile --warnings-as-errors
      - if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: floor-${{ steps.versions.outputs.elixir }}-${{ steps.versions.outputs.otp }}-${{ hashFiles('mix.lock') }}

  # The dev build the package, confidentiality and security jobs restore.
  dev:
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # twice the slowest green, 141s on run 44196835879
    steps:
      - name: Refuse any ref but the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "$DEFAULT_BRANCH" ] || [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::The cache warmer runs only on the default branch; this run is on $GITHUB_REF."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: lookup
        with:
          path: |
            deps
            _build
          key: dev-${{ needs.toolchain.outputs.elixir }}-${{ needs.toolchain.outputs.otp }}-${{ hashFiles('mix.lock') }}
          lookup-only: true
      - if: steps.lookup.outputs.cache-hit != 'true'
        uses: ./.github/actions/beam
        with:
          elixir: ${{ needs.toolchain.outputs.elixir }}
          otp: ${{ needs.toolchain.outputs.otp }}
      - if: steps.lookup.outputs.cache-hit != 'true'
        run: mix deps.get --check-locked
      - if: steps.lookup.outputs.cache-hit != 'true'
        run: mix compile --warnings-as-errors
      - if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: dev-${{ needs.toolchain.outputs.elixir }}-${{ needs.toolchain.outputs.otp }}-${{ hashFiles('mix.lock') }}
