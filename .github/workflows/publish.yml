name: Publish to Hex

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Full 40-hex lowercase SHA of the qualified release commit
        required: true
        type: string
      qualification_run:
        description: Original CI run ID when reusing qualified archives
        required: false
        type: string

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  upload:
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    environment: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # the five-minute floor; upload took 30s on baselabs/ash_replicant run 45924640396
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      version: ${{ steps.hex.outputs.version }}
      qualification-run: ${{ steps.hex.outputs.qualification-run }}
      qualification-sha256: ${{ steps.hex.outputs.qualification-sha256 }}
    steps:
      - name: Admit the default ref and full release commit
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          LC_ALL: C
        run: |
          [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Read the release runtime with the pinned shared reader
        id: toolchain
        run: |
          reader="$RUNNER_TEMP/hex-release-toolchain.sh"
          git show HEAD:scripts/toolchain.sh > "$reader"
          printf '%s  %s\n' 25bbfa023b7f031256428b498fe300fcc460988fea81277072355e4c0d933764 "$reader" | sha256sum --check --status
          git show HEAD:.tool-versions > "$RUNNER_TEMP/hex-release-tool-versions"
          pins="$(bash "$reader" "$RUNNER_TEMP/hex-release-tool-versions")"
          elixir="$(awk -F= '$1 == "elixir" { print $2 }' <<< "$pins")"
          otp="$(awk -F= '$1 == "otp" { print $2 }' <<< "$pins")"
          [[ "$elixir" =~ ^[0-9]+\.[0-9]+\.[0-9]+-otp-[0-9]+$ ]]
          [[ "$otp" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'elixir=%s\notp=%s\n' "$elixir" "$otp" >> "$GITHUB_OUTPUT"
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ steps.toolchain.outputs.elixir }}
          otp-version: ${{ steps.toolchain.outputs.otp }}
          version-type: strict
          install-hex: false
          install-rebar: false
      - name: Verify the runtime and install the shared Hex pin outside Mix source
        working-directory: ${{ runner.temp }}
        env:
          WANT_ELIXIR: ${{ steps.toolchain.outputs.elixir }}
          WANT_OTP: ${{ steps.toolchain.outputs.otp }}
        run: |
          bash "$RUNNER_TEMP/hex-release-toolchain.sh" --installed "elixir=$WANT_ELIXIR" "erlang=$WANT_OTP"
          test ! -e mix.exs
          hex_version="$(curl --fail --silent --show-error --max-time 30 'https://raw.githubusercontent.com/baselabs/.github/3bfbb84692a65b4d2c03dc3b7932353026fe6943/.github/actions/hex-publish/hex-version')"
          [[ "$hex_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mix local.hex "$hex_version" --force
      - uses: baselabs/.github/.github/actions/hex-publish@3bfbb84692a65b4d2c03dc3b7932353026fe6943
        id: hex
        with:
          operation: upload
          package: ash_hooks
          package-directory: .
          release-commit: ${{ inputs.release_commit }}
          qualification-run: ${{ inputs.qualification_run }}
          organization-read-key: ${{ secrets.HEX_ORG_KEY_PUBLISH_API_READ }}
      - name: Remove the copied shared reader
        if: always()
        run: rm -f "$RUNNER_TEMP/hex-release-toolchain.sh" "$RUNNER_TEMP/hex-release-tool-versions"

  read-back:
    needs: upload
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    runs-on: ubuntu-24.04
    timeout-minutes: 90 # no ash_hooks green run yet with shared read-back
    permissions:
      contents: read
      actions: read
    outputs:
      commit: ${{ steps.hex.outputs.commit }}
    steps:
      - name: Admit the default ref and full release commit
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          LC_ALL: C
        run: |
          [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Read the release runtime with the pinned shared reader
        id: toolchain
        run: |
          reader="$RUNNER_TEMP/hex-release-toolchain.sh"
          git show HEAD:scripts/toolchain.sh > "$reader"
          printf '%s  %s\n' 25bbfa023b7f031256428b498fe300fcc460988fea81277072355e4c0d933764 "$reader" | sha256sum --check --status
          git show HEAD:.tool-versions > "$RUNNER_TEMP/hex-release-tool-versions"
          pins="$(bash "$reader" "$RUNNER_TEMP/hex-release-tool-versions")"
          elixir="$(awk -F= '$1 == "elixir" { print $2 }' <<< "$pins")"
          otp="$(awk -F= '$1 == "otp" { print $2 }' <<< "$pins")"
          [[ "$elixir" =~ ^[0-9]+\.[0-9]+\.[0-9]+-otp-[0-9]+$ ]]
          [[ "$otp" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'elixir=%s\notp=%s\n' "$elixir" "$otp" >> "$GITHUB_OUTPUT"
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ steps.toolchain.outputs.elixir }}
          otp-version: ${{ steps.toolchain.outputs.otp }}
          version-type: strict
          install-hex: false
          install-rebar: false
      - name: Verify the runtime and install the shared Hex pin outside Mix source
        working-directory: ${{ runner.temp }}
        env:
          WANT_ELIXIR: ${{ steps.toolchain.outputs.elixir }}
          WANT_OTP: ${{ steps.toolchain.outputs.otp }}
        run: |
          bash "$RUNNER_TEMP/hex-release-toolchain.sh" --installed "elixir=$WANT_ELIXIR" "erlang=$WANT_OTP"
          test ! -e mix.exs
          hex_version="$(curl --fail --silent --show-error --max-time 30 'https://raw.githubusercontent.com/baselabs/.github/3bfbb84692a65b4d2c03dc3b7932353026fe6943/.github/actions/hex-publish/hex-version')"
          [[ "$hex_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mix local.hex "$hex_version" --force
      - uses: baselabs/.github/.github/actions/hex-publish@3bfbb84692a65b4d2c03dc3b7932353026fe6943
        id: hex
        with:
          operation: read-back
          package: ash_hooks
          package-directory: .
          release-commit: ${{ inputs.release_commit }}
          qualification-run: ${{ needs.upload.outputs.qualification-run }}
          qualification-sha256: ${{ needs.upload.outputs.qualification-sha256 }}
          release-assets-directory: ${{ runner.temp }}/release-assets
      - name: Record the published commit
        env:
          PUBLISHED_COMMIT: ${{ steps.hex.outputs.commit }}
        run: printf 'Published commit %s\n' "$PUBLISHED_COMMIT" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain the verified release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Remove release scratch files
        if: always()
        run: rm -rf "$RUNNER_TEMP/hex-release-toolchain.sh" "$RUNNER_TEMP/hex-release-tool-versions" "$RUNNER_TEMP/release-assets"

  published-livebook:
    needs: [upload, read-back]
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    runs-on: ubuntu-24.04
    timeout-minutes: 90 # no green run yet as a separate job
    services:
      receiver:
        image: ghcr.io/tarampampam/webhook-tester:2.3.0@sha256:85818267b450d3d386cad6510c561e09b974183ed2832c373bc83b125fc1b221
        env:
          STORAGE_DRIVER: memory
          AUTO_CREATE_SESSIONS: "true"
          MAX_REQUESTS: "1000"
        ports:
          - 52871:8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.read-back.outputs.commit }}
          persist-credentials: false
      - name: Read the runtime toolchain
        id: toolchain
        run: scripts/toolchain.sh >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/beam
        with:
          elixir: ${{ steps.toolchain.outputs.elixir }}
          otp: ${{ steps.toolchain.outputs.otp }}
      - run: mix deps.get --check-locked
      - name: Verify the versioned HexDocs page
        env:
          VERSION: ${{ needs.upload.outputs.version }}
        run: |
          timeout 300s curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 \
            --retry 20 --retry-all-errors --retry-delay 15 --retry-max-time 300 \
            --output /dev/null "https://hexdocs.pm/ash_hooks/$VERSION/readme.html"
      - name: Wait for the real receiver
        run: curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:52871/api/version
      - name: Run the Livebook against the published package
        run: ./scripts/run-livebook.sh documentation/livebooks/get-started.livemd
