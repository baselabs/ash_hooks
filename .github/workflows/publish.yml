name: Publish to Hex

# The release maintainer dispatches this from main after the owner approves.
# main moves only after the CI run on that exact commit passes. The release
# maintainer reads back both archives before pushing the tag and creating the
# GitHub Release from release-assets. No job replaces published bytes.
on:
  workflow_dispatch:

permissions:
  contents: read

# A second dispatch finishes an earlier upload without racing another dispatch.
concurrency:
  group: publish
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build release assets
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    environment: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # the five-minute floor; the slowest green was 114s on keyless rehearsal run 44380961139
    env:
      MIX_ENV: dev
    outputs:
      version: ${{ steps.version.outputs.version }}
      package_sha256: ${{ steps.assets.outputs.package_sha256 }}
      docs_sha256: ${{ steps.assets.outputs.docs_sha256 }}
      elixir: ${{ steps.toolchain.outputs.elixir }}
      otp: ${{ steps.toolchain.outputs.otp }}
    steps:
      - name: Refuse any ref but the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "$DEFAULT_BRANCH" ] || [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Publish runs only from the default branch; this run is on $GITHUB_REF."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the runtime toolchain
        id: toolchain
        run: sh scripts/toolchain.sh >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/beam
        with:
          elixir: ${{ steps.toolchain.outputs.elixir }}
          otp: ${{ steps.toolchain.outputs.otp }}
      - name: Read the package version
        id: version
        run: |
          python3 -I - >> "$GITHUB_OUTPUT" <<'PY'
          from pathlib import Path
          import re
          matches = re.findall(r'^  @version "([^"]+)"$', Path('mix.exs').read_text(), re.M)
          assert len(matches) == 1, 'expected exactly one Mix project version'
          print(f'version={matches[0]}')
          PY
      - name: Refuse a tag, a missing package name or a retired release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null || status=$?
          case "$status" in
            2) ;;
            0) echo "::error::Tag v$VERSION already exists."; exit 1 ;;
            *) echo "::error::git ls-remote failed with status $status; refusing without a definite answer."; exit 1 ;;
          esac
          python3 -I scripts/hex-release-state.py pre-build "$VERSION"
      - name: Fetch the locked dependencies
        run: mix deps.get --check-locked
      - name: Generated formatter and DSL references match the commit
        run: |
          mix format
          mix spark.generate
          git diff --exit-code -- .formatter.exs mix.exs lib test scripts/generate-dsl-docs.exs documentation/dsls
      - run: mix spark.check
      - name: Build and inspect the package archive
        run: ./scripts/check-package.sh
      - run: env -u ASH_HOOKS_NO_OPTIONAL mix docs --warnings-as-errors
      - run: python3 scripts/check-document-dashes.py --docs doc
      - name: Build and inspect the docs archive
        run: |
          (cd "$RUNNER_TEMP" && mix run --no-mix-exs "$GITHUB_WORKSPACE/scripts/build-docs-archive.exs" \
            "$GITHUB_WORKSPACE/doc" "$RUNNER_TEMP/ash_hooks-docs.tar.gz")
          python3 -I scripts/check-docs-archive.py "$RUNNER_TEMP/ash_hooks-docs.tar.gz" doc
      - name: Refuse a checkout that differs from the commit
        run: |
          git check-ignore --quiet doc/
          git check-ignore --quiet _build/
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "::error::The checkout differs from $GITHUB_SHA."
            exit 1
          fi
      - name: Assemble the inspected release assets
        id: assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          assets="$RUNNER_TEMP/release-assets"
          mkdir -p "$assets"
          cp "_build/release/ash_hooks-$VERSION.tar" "$assets/ash_hooks-$VERSION.tar"
          cp "$RUNNER_TEMP/ash_hooks-docs.tar.gz" "$assets/ash_hooks-$VERSION-docs.tar.gz"
          (
            cd "$assets" || exit
            sha256sum "ash_hooks-$VERSION.tar" "ash_hooks-$VERSION-docs.tar.gz" > SHA256SUMS
          )
          python3 -I - <<'PY'
          import hashlib, os, re
          from pathlib import Path
          assets = Path(os.environ['RUNNER_TEMP']) / 'release-assets'
          version = os.environ['VERSION']
          changelog = Path('CHANGELOG.md').read_text()
          sections = re.findall(
              rf'^## \[{re.escape(version)}\][^\n]*\n.*?(?=^## |\Z)',
              changelog, re.M | re.S
          )
          if len(sections) != 1 or not re.sub(r'^\s*#+[^\n]*$', '', sections[0].partition('\n')[2], flags=re.M).strip():
              raise SystemExit('Release changelog section is missing, duplicated or empty.')
          package = hashlib.sha256((assets / f'ash_hooks-{version}.tar').read_bytes()).hexdigest()
          docs = hashlib.sha256((assets / f'ash_hooks-{version}-docs.tar.gz').read_bytes()).hexdigest()
          notes = sections[0].strip() + '\n\n'
          notes += f'Commit: {os.environ["GITHUB_SHA"]}\n\n'
          notes += f'Package SHA-256: {package}\n\nDocs SHA-256: {docs}\n'
          (assets / 'RELEASE-NOTES.md').write_text(notes)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'package_sha256={package}\ndocs_sha256={docs}\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets/
          if-no-files-found: error

  upload:
    name: Upload inspected assets
    needs: build
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    environment: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # the five-minute floor; the slowest green was 21s on keyless rehearsal run 44380961139
    env:
      VERSION: ${{ needs.build.outputs.version }}
      PACKAGE_SHA256: ${{ needs.build.outputs.package_sha256 }}
      DOCS_SHA256: ${{ needs.build.outputs.docs_sha256 }}
    steps:
      - name: Refuse any ref but the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "$DEFAULT_BRANCH" ] || [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Publish runs only from the default branch; this run is on $GITHUB_REF."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/hex-release-state.py
            /scripts/publish-hex-release.exs
            /.github/actions/beam/
      - uses: ./.github/actions/beam
        with:
          elixir: ${{ needs.build.outputs.elixir }}
          otp: ${{ needs.build.outputs.otp }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets
      - name: Verify the downloaded archive checksums
        working-directory: ${{ runner.temp }}/release-assets
        run: |
          test ! -e mix.exs
          sha256sum -c SHA256SUMS
          printf '%s  %s\n' "$PACKAGE_SHA256" "ash_hooks-$VERSION.tar" \
            "$DOCS_SHA256" "ash_hooks-$VERSION-docs.tar.gz" | sha256sum -c -
      - name: Decide which archives hex.pm is missing
        id: state
        run: |
          python3 -I scripts/hex-release-state.py post-build "$VERSION" \
            --package-archive "$RUNNER_TEMP/release-assets/ash_hooks-$VERSION.tar" \
            --docs-archive "$RUNNER_TEMP/release-assets/ash_hooks-$VERSION-docs.tar.gz"
      # This runner has run no project code. Only this step receives the key.
      - name: Upload the missing inspected archives
        if: steps.state.outputs.package == 'upload' || steps.state.outputs.docs == 'upload'
        working-directory: ${{ runner.temp }}/release-assets
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
          PACKAGE_STATE: ${{ steps.state.outputs.package }}
          DOCS_STATE: ${{ steps.state.outputs.docs }}
        run: |
          mix run --no-mix-exs "$GITHUB_WORKSPACE/scripts/publish-hex-release.exs" \
            "$VERSION" "ash_hooks-$VERSION.tar" "ash_hooks-$VERSION-docs.tar.gz" \
            "$PACKAGE_STATE" "$DOCS_STATE"

  # Read back the release with no environment and no access to the key.
  verify:
    name: Read back
    needs: [build, upload]
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    runs-on: ubuntu-24.04
    # Twice 170s on keyless rehearsal run 44380961139 is 5.7 minutes, plus
    # bounded propagation: 2.5 minutes package archive, 5 docs archive,
    # 5 HexDocs and 5 registry. 24 minutes rounds up 5.7 + 2.5 + 5 + 5 + 5.
    timeout-minutes: 24
    services:
      receiver:
        image: ghcr.io/tarampampam/webhook-tester@sha256:85818267b450d3d386cad6510c561e09b974183ed2832c373bc83b125fc1b221
        env:
          STORAGE_DRIVER: memory
          AUTO_CREATE_SESSIONS: "true"
          MAX_REQUESTS: "1000"
        ports:
          - 52871:8080
    env:
      VERSION: ${{ needs.build.outputs.version }}
      SHA256: ${{ needs.build.outputs.package_sha256 }}
      DOCS_SHA256: ${{ needs.build.outputs.docs_sha256 }}
    steps:
      - name: Refuse any ref but the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "$DEFAULT_BRANCH" ] || [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Publish runs only from the default branch; this run is on $GITHUB_REF."
            exit 1
          fi
      - name: The package archive on Hex is the inspected archive
        run: |
          archive="$RUNNER_TEMP/ash_hooks-$VERSION.tar"
          timeout 150s curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 \
            --retry 10 --retry-all-errors --retry-delay 15 --retry-max-time 150 \
            --output "$archive" "https://repo.hex.pm/tarballs/ash_hooks-$VERSION.tar"
          printf '%s  %s\n' "$SHA256" "$archive" | sha256sum -c -
      - name: The docs archive on Hex is the inspected archive
        run: |
          archive="$RUNNER_TEMP/ash_hooks-$VERSION-docs.tar.gz"
          timeout 300s curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 \
            --retry 20 --retry-all-errors --retry-delay 15 --retry-max-time 300 \
            --output "$archive" "https://repo.hex.pm/docs/ash_hooks-$VERSION.tar.gz"
          printf '%s  %s\n' "$DOCS_SHA256" "$archive" | sha256sum -c -
      - name: HexDocs serves the version
        run: |
          timeout 300s curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 \
            --retry 20 --retry-all-errors --retry-delay 15 --retry-max-time 300 \
            --output /dev/null "https://hexdocs.pm/ash_hooks/$VERSION/readme.html"
      # The signed registry is what Mix.install verifies against. A release
      # record encodes its version (field 1) before its 32-byte inner checksum
      # (field 2), and carries its 32-byte outer checksum (field 5).
      - name: The Hex registry lists the version with the inspected checksum
        run: |
          deadline=$((SECONDS + 300))
          while [ "$SECONDS" -lt "$deadline" ]; do
            remaining=$((deadline - SECONDS))
            if curl --fail --silent --show-error --connect-timeout 10 --max-time "$remaining" \
              "https://repo.hex.pm/packages/ash_hooks" | gunzip |
              python3 -I -c '
          import os, sys
          registry = sys.stdin.buffer.read()
          version = os.environ["VERSION"].encode()
          sys.exit(0 if b"\x0a" + bytes([len(version)]) + version + b"\x12\x20" in registry
                   and b"\x2a\x20" + bytes.fromhex(os.environ["SHA256"]) in registry else 1)
          '; then
              exit 0
            fi
            remaining=$((deadline - SECONDS))
            if [ "$remaining" -gt 0 ]; then
              sleep "$((remaining < 15 ? remaining : 15))"
            fi
          done
          echo "::error::The Hex registry does not list ash_hooks $VERSION with SHA-256 $SHA256."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/beam
        with:
          elixir: ${{ needs.build.outputs.elixir }}
          otp: ${{ needs.build.outputs.otp }}
      - run: mix deps.get --check-locked
      - name: Wait for the real receiver
        run: curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:52871/api/version
      - name: Run the Livebook against the published package
        run: ./scripts/run-livebook.sh documentation/livebooks/get-started.livemd
      - name: Record the verified release
        run: |
          {
            echo "## ash_hooks $VERSION"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Package SHA-256: \`$SHA256\`"
            echo "- Docs SHA-256: \`$DOCS_SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"
