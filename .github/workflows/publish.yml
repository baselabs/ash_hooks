name: Publish to Hex

# The release maintainer dispatches this from main after the owner approves.
# main moves only after the CI run on that exact commit passes. The release
# maintainer pushes the annotated v<version> tag on the published commit after
# the read-back below.
# ash_hooks is a public package on hex.pm, so there is no organization step.
on:
  workflow_dispatch:

permissions:
  contents: read

# Two dispatches never race past the version refusal.
concurrency:
  group: publish
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Publish
    # The Hex key belongs only to the protected publish environment. Its
    # deployment branch policy admits only main; only an owner's dispatch or
    # re-run may use it.
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    environment: publish
    # A public repository runs only on GitHub-hosted runners.
    runs-on: ubuntu-24.04
    timeout-minutes: 4 # twice the slowest green, 111s on rehearsal run 44179917802
    env:
      MIX_ENV: dev
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha256: ${{ steps.package.outputs.sha256 }}
      elixir: ${{ steps.toolchain.outputs.elixir }}
      otp: ${{ steps.toolchain.outputs.otp }}
    steps:
      - name: Refuse any ref but the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "$DEFAULT_BRANCH" ] || [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Publish runs only from the default branch; this run is on $GITHUB_REF."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The same reader and file CI uses, so the published build runs on the
      # runtime every CI run tested.
      - name: Read the runtime toolchain
        id: toolchain
        run: sh scripts/toolchain.sh >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/beam
        with:
          elixir: ${{ steps.toolchain.outputs.elixir }}
          otp: ${{ steps.toolchain.outputs.otp }}
      - name: Read the package version
        id: version
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          from pathlib import Path
          import re
          matches = re.findall(r'^  @version "([^"]+)"$', Path('mix.exs').read_text(), re.M)
          assert len(matches) == 1, 'expected exactly one Mix project version'
          print(f'version={matches[0]}')
          PY
      - name: Refuse a version already on Hex or tagged
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          status=$(curl --silent --show-error --retry 3 --output /dev/null --write-out '%{http_code}' \
            "https://hex.pm/api/packages/ash_hooks/releases/$VERSION")
          case "$status" in
            404) ;;
            200) echo "::error::ash_hooks $VERSION is already on Hex."; exit 1 ;;
            *) echo "::error::Hex answered $status for ash_hooks $VERSION; refusing without a definite answer."; exit 1 ;;
          esac
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null || status=$?
          case "$status" in
            2) ;;
            0) echo "::error::Tag v$VERSION already exists."; exit 1 ;;
            *) echo "::error::git ls-remote failed with status $status; refusing without a definite answer."; exit 1 ;;
          esac
      - name: Fetch the locked dependencies
        run: mix deps.get --check-locked
      # The package job's checks, on the commit being published.
      - name: Generated formatter and DSL references match the commit
        run: |
          mix format
          mix spark.generate
          git diff --exit-code -- .formatter.exs mix.exs lib test scripts/generate-dsl-docs.exs documentation/dsls
      - run: mix spark.check
      - name: Build and inspect the archive
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./scripts/check-package.sh
          echo "sha256=$(sha256sum "_build/release/ash_hooks-$VERSION.tar" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - run: mix docs --warnings-as-errors
      - run: python3 scripts/check-document-dashes.py --docs doc
      - name: Refuse a checkout that differs from the commit
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "::error::The checkout differs from $GITHUB_SHA."
            exit 1
          fi
      # Optional Oban and Plug requirements are published only with
      # ASH_HOOKS_NO_OPTIONAL unset. The key is in this step's environment only.
      - name: Publish to hex.pm
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: env -u ASH_HOOKS_NO_OPTIONAL mix hex.publish --yes

  # Reads the release back with no access to the key: the archive Hex serves is
  # the archive inspected above, HexDocs serves the version, and the Livebook
  # runs against the published package from hex.pm.
  verify:
    name: Read back
    needs: publish
    runs-on: ubuntu-24.04
    # Twice the slowest green (170s on rehearsal run 44179917802) plus the
    # bounded propagation retries below: up to 2.5 minutes for the archive,
    # 5 for HexDocs and 5 for the registry.
    timeout-minutes: 19
    services:
      receiver:
        image: ghcr.io/tarampampam/webhook-tester@sha256:85818267b450d3d386cad6510c561e09b974183ed2832c373bc83b125fc1b221
        env:
          STORAGE_DRIVER: memory
          AUTO_CREATE_SESSIONS: "true"
          MAX_REQUESTS: "1000"
        ports:
          - 52871:8080
    env:
      VERSION: ${{ needs.publish.outputs.version }}
      SHA256: ${{ needs.publish.outputs.sha256 }}
    steps:
      - name: The archive on Hex is the inspected archive
        run: |
          archive="$RUNNER_TEMP/ash_hooks-$VERSION.tar"
          curl --fail --silent --show-error --location --retry 10 --retry-all-errors --retry-delay 15 \
            --output "$archive" "https://repo.hex.pm/tarballs/ash_hooks-$VERSION.tar"
          published=$(sha256sum "$archive" | cut -d' ' -f1)
          if [ "$published" != "$SHA256" ]; then
            echo "::error::Hex serves ash_hooks $VERSION with SHA-256 $published; the inspected archive was $SHA256."
            exit 1
          fi
          {
            echo "## ash_hooks $VERSION"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Archive SHA-256: \`$SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: HexDocs serves the version
        run: |
          curl --fail --silent --show-error --location --retry 20 --retry-all-errors --retry-delay 15 \
            --output /dev/null "https://hexdocs.pm/ash_hooks/$VERSION/readme.html"
      # The signed registry is what Mix.install verifies against. A release
      # record encodes its version (field 1) before its 32-byte inner checksum
      # (field 2), and carries its 32-byte outer checksum (field 5).
      - name: The Hex registry lists the version with the inspected checksum
        run: |
          for _ in $(seq 1 20); do
            if curl --fail --silent --show-error "https://repo.hex.pm/packages/ash_hooks" | gunzip |
              python3 -c '
          import os, sys
          registry = sys.stdin.buffer.read()
          version = os.environ["VERSION"].encode()
          sys.exit(0 if b"\x0a" + bytes([len(version)]) + version + b"\x12\x20" in registry
                   and b"\x2a\x20" + bytes.fromhex(os.environ["SHA256"]) in registry else 1)
          '; then
              exit 0
            fi
            sleep 15
          done
          echo "::error::The Hex registry does not list ash_hooks $VERSION with SHA-256 $SHA256."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/beam
        with:
          elixir: ${{ needs.publish.outputs.elixir }}
          otp: ${{ needs.publish.outputs.otp }}
      - run: mix deps.get --check-locked
      - name: Wait for the real receiver
        run: curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:52871/api/version
      - name: Run the Livebook against the published package
        run: ./scripts/run-livebook.sh documentation/livebooks/get-started.livemd
