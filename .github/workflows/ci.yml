name: CI

on:
  push:
    branches: [main, 'kci/**']
    tags: ['v*']
    paths-ignore: ['LICENSE*', '.github/ISSUE_TEMPLATE/**']
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The matrix tests the supported Elixir window (~> 1.20 in mix.exs) on
  # the OTP releases this project targets. The dev default is the latest
  # stable Elixir on OTP 29, mirrored exactly from .tool-versions; OTP 28 is the other end of the supported window.
  # Default legs build with the full dev dep set; the no-optional leg proves the
  # package compiles/tests/runs with oban and plug entirely absent
  # (ADR-0004).
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Dev default — the version set, mirrors .tool-versions exactly.
          - elixir: "1.20.5"
            otp: "29.1.2"
          # OTP 28 — the other end of the supported OTP range.
          - elixir: "1.20.5"
            otp: "28"
          # ADR-0004 proof: oban/plug dropped from the dep list entirely —
          # the package must compile, test, and run with neither loaded.
          - elixir: "1.20.5"
            otp: "29.1.2"
            no_optional: "1"
    env:
      MIX_ENV: test
      ASH_HOOKS_NO_OPTIONAL: ${{ matrix.no_optional }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            deps
            _build
          key: mix-${{ matrix.elixir }}-${{ matrix.otp }}-noopt-${{ matrix.no_optional }}-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      # Check dependency retirement and advisories.
      # Fresh disclosures can precede registry updates; inspect the published
      # ranges for directly affected dependencies.
      - run: mix hex.audit
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix credo --strict
      - run: mix test
      - name: Assert optional deps never loaded (no-optional leg)
        if: matrix.no_optional == '1'
        run: |
          mix run --no-start -e 'if :code.which(Oban) != :non_existing or :code.which(Plug) != :non_existing, do: (IO.puts("optional dep loaded"); System.halt(1))'

  # A minimal production consumer pins the actual Ash floor, 3.37.2,
  # on Elixir 1.20. Dev/test and optional dependencies cannot mask OTP
  # startup requirements or unavailable APIs in this consumer graph.
  floor:
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          elixir-version: "1.20.0"
          otp-version: "28"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            deps
            _build
          key: mix-floor-1.20-28-${{ hashFiles('mix.exs') }}
      - run: rm mix.lock
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix test
      - run: env MIX_ENV=prod ASH_HOOKS_MINIMUM_ASH=1 mix deps.get
        working-directory: test/consumer
      - run: env MIX_ENV=prod ASH_HOOKS_MINIMUM_ASH=1 mix compile --warnings-as-errors
        working-directory: test/consumer
      - run: env MIX_ENV=prod ASH_HOOKS_MINIMUM_ASH=1 mix run verify.exs
        working-directory: test/consumer

  # Qualify real PostgreSQL consumers, persisted workers, and delivery.
  # ASH_HOOKS_POSTGRES=1 enables the PostgreSQL resources.
  # Ordinary development uses SQLite.
  postgres:
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
      ASH_HOOKS_POSTGRES: "1"
      ASH_HOOKS_TEST_PG_HOST: localhost
      ASH_HOOKS_TEST_PG_PORT: "5432"
      ASH_HOOKS_TEST_PG_USER: postgres
      ASH_HOOKS_TEST_PG_PASSWORD: postgres
      ASH_HOOKS_TEST_PG_DATABASE: ash_hooks_test
      ASH_HOOKS_REAL_RECEIVER_PORT: "52871"
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ash_hooks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      receiver:
        image: ghcr.io/tarampampam/webhook-tester@sha256:85818267b450d3d386cad6510c561e09b974183ed2832c373bc83b125fc1b221
        env:
          STORAGE_DRIVER: memory
          AUTO_CREATE_SESSIONS: "true"
          MAX_REQUESTS: "1000"
        ports:
          - 52871:8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          elixir-version: "1.20.5"
          otp-version: "29.1.2"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            deps
            _build
          key: mix-pg-1.20.5-29.1.2-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - run: mix hex.audit
      - run: mix compile --warnings-as-errors
      - name: Wait for the real receiver
        run: curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:52871/api/version
      - name: Coverage gate (100% of the declared Mix surface)
        run: mix test --cover
      - name: Upload coverage HTML on a gate miss
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cover-html
          path: cover/

  # Type-check the public API and the consumer worker compiled from test/support.
  # The PostgreSQL suite exercises that same generated worker at runtime.
  dialyzer:
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          elixir-version: "1.20.5"
          otp-version: "29.1.2"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            deps
            _build
            ~/.mix
          key: dialyzer-1.20.5-29.1.2-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - run: mix dialyzer

  # Verify the package archive and build HexDocs.
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          elixir-version: "1.20.5"
          otp-version: "29.1.2"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            deps
            _build
          key: package-1.20.5-29.1.2-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - name: Formatter export and DSL references match the DSL (generated files must not drift)
        run: mix spark.check
      - name: Tarball carries every publish surface
        run: ./scripts/check-package.sh
      - run: mix docs --warnings-as-errors

  # The get-started Livebook, verified headless on one leg: the elixir
  # cells are extracted in order and run outside any mix project
  # (Mix.install requires it) — the same evaluation Livebook performs.
  livebook:
    runs-on: ubuntu-24.04
    services:
      receiver:
        image: ghcr.io/tarampampam/webhook-tester@sha256:85818267b450d3d386cad6510c561e09b974183ed2832c373bc83b125fc1b221
        env:
          STORAGE_DRIVER: memory
          AUTO_CREATE_SESSIONS: "true"
          MAX_REQUESTS: "1000"
        ports:
          - 52871:8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          elixir-version: "1.20.5"
          otp-version: "29.1.2"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.mix
            ~/.cache
          key: livebook-mix-1.20.5-29.1.2-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - run: ./scripts/check-package.sh
      - name: Wait for the real receiver
        run: curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:52871/api/version
      - name: Run the livebook against the candidate archive (version from mix.exs)
        run: |
          archive="_build/release/ash_hooks-$(grep -m1 '@version' mix.exs | sed -E 's/.*@version "([^"]+)".*/\1/').tar"
          ./scripts/run-livebook.sh documentation/livebooks/get-started.livemd --archive "$archive"

  # Scan the development, declared-floor consumer, and hex-and-git fixture locks.
  # Download OSV's Hex database before scanning offline in a network namespace.
  # No lock data leaves the runner.
  # check-advisories.sh verifies Mix lock encoding and complete entry counts.
  # Unread dependencies and advisories fail closed.
  # hex.audit rejects retired packages.
  security:
    runs-on: ubuntu-24.04
    env:
      OSV_SCANNER_VERSION: "2.7.1"
      OSV_SCANNER_SHA256: fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8
    steps:
      - name: Require Linux (the scan's network namespace)
        run: test "$(uname -s)" = Linux
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          elixir-version: "1.20.5"
          otp-version: "29.1.2"
      - name: Install checksum-pinned osv-scanner
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Download OSV's Hex database (no lock file sent)
        run: |
          db="$RUNNER_TEMP/osv-db"
          mkdir -p "$db/osv-scalibr/Hex"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 \
            -o "$db/osv-scalibr/Hex/all.zip" \
            https://osv-vulnerabilities.storage.googleapis.com/Hex/all.zip
          test -s "$db/osv-scalibr/Hex/all.zip"
          echo "OSV_SCANNER_LOCAL_DB_CACHE_DIRECTORY=$db" >> "$GITHUB_ENV"
      - name: Fetch exactly the locked dependencies
        run: mix deps.get --check-locked
      - name: Retired packages
        run: mix hex.audit
      - name: Resolve a consumer at the declared Ash floor
        run: env MIX_ENV=prod ASH_HOOKS_MINIMUM_ASH=1 mix deps.get
        working-directory: test/consumer
      - name: Advisories in the development lock, the floor consumer's lock and the hex-and-git fixture
        run: scripts/check-advisories.sh mix.lock test/consumer/mix.lock scripts/fixtures/hex-and-git.mix.lock.fixture

  # The single branch-protection check name: require `all-checks-pass`
  # on main and every leg (test matrix, floor, dialyzer, package,
  # postgres, livebook, security) gates through it — no per-job
  # check-name maintenance when the matrix grows.
  all-checks-pass:
    needs: [test, floor, postgres, dialyzer, package, livebook, security]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every needed job green
        run: |
          results='${{ toJSON(needs) }}'
          failed=$(printf '%s' "$results" | python3 -c '
          import json, sys
          results = json.load(sys.stdin)
          failed = [name for name, job in results.items() if job["result"] != "success"]
          print(",".join(failed))
          ')
          if [ -n "$failed" ]; then
            echo "failed jobs: $failed" >&2
            exit 1
          fi
          echo "all checks passed"
