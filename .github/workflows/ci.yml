name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Default legs build with the full dev dep set; the no-optional leg proves
  # the package compiles/tests/runs with oban and plug entirely absent
  # (ADR-0004).
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.17"
            otp: "27"
          - elixir: "1.18"
            otp: "27"
          # ADR-0004 proof: oban/plug dropped from the dep list entirely —
          # the package must compile, test, and run with neither loaded.
          - elixir: "1.18"
            otp: "27"
            no_optional: "1"
    env:
      MIX_ENV: test
      ASH_HOOKS_NO_OPTIONAL: ${{ matrix.no_optional }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            deps
            _build
          key: mix-${{ matrix.elixir }}-${{ matrix.otp }}-noopt-${{ matrix.no_optional }}-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix credo --strict
      - run: mix test
      # advisory coverage printout (built-in; no threshold gate). Spark
      # module cover-compilation is flaky on some legs — advisory means
      # it must not red the build
      - name: Advisory coverage report
        run: mix test --cover
        if: matrix.no_optional != '1' && matrix.elixir == '1.18'
        continue-on-error: true
      - name: Assert optional deps never loaded (no-optional leg)
        if: matrix.no_optional == '1'
        run: |
          mix run --no-start -e 'if :code.which(Oban) != :non_existing or :code.which(Plug) != :non_existing, do: (IO.puts("optional dep loaded"); System.halt(1))'

  # The declared Elixir ~> 1.17 minimum, resolved AT THE FLOORS: the lock
  # is dropped so the resolver picks the newest versions whose own floors
  # still admit the minimum — the combination a fresh consumer actually
  # gets. (The original 1.15 claim was DISPROVEN by this leg on its first
  # run: modern ash uses the Duration struct, added in Elixir 1.17 — no
  # ash 3.x compiles on 1.15/1.16. Never keep a floor this leg disproves.)
  floor:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          elixir-version: "1.17"
          otp-version: "27"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            deps
            _build
          key: mix-floor-1.17-27-${{ hashFiles('mix.exs') }}
      - run: rm mix.lock
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix test

  # Type-check gate on the public API (found the dead IP-SAN matcher on
  # its first run — 2026-08-22).
  dialyzer:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          elixir-version: "1.18"
          otp-version: "27"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            deps
            _build
            ~/.mix
          key: dialyzer-1.18-27-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - run: mix dialyzer

  # What SHIPS is what was checked: the hex tarball must carry every
  # publish surface (the 0.2.2 usage-rules.md miss was caught
  # post-release; this leg is the mechanical form of that lesson), and
  # hexdocs must build.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          elixir-version: "1.18"
          otp-version: "27"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            deps
            _build
          key: package-1.18-27-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - name: DSL cheat sheets match the DSL (generated files must not drift)
        run: mix spark.cheat_sheets --check
      - name: Tarball carries every publish surface
        run: |
          env -u ASH_HOOKS_NO_OPTIONAL mix hex.build
          mkdir -p /tmp/tarcheck && tar -xf ash_hooks-*.tar -C /tmp/tarcheck contents.tar.gz
          tar -tzf /tmp/tarcheck/contents.tar.gz | tee /tmp/tar-list.txt
          grep -qx "README.md" /tmp/tar-list.txt
          grep -qx "CHANGELOG.md" /tmp/tar-list.txt
          grep -qx "usage-rules.md" /tmp/tar-list.txt
          grep -qx "UPGRADING.md" /tmp/tar-list.txt
          grep -qx "SECURITY.md" /tmp/tar-list.txt
          grep -qx "LICENSE" /tmp/tar-list.txt
      - run: mix docs

  # The get-started Livebook, verified headless on one leg: the elixir
  # cells are extracted in order and run outside any mix project
  # (Mix.install requires it) — the same evaluation Livebook performs.
  livebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          elixir-version: "1.18"
          otp-version: "27"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.mix
            ~/.cache
          key: livebook-mix-${{ hashFiles('mix.lock') }}
      - run: ./scripts/run-livebook.sh documentation/livebooks/get-started.livemd
