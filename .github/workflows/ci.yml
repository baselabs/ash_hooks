name: CI

on:
  push:
    branches: [main, 'kci/**']
    tags: ['v*']
    paths-ignore: ['LICENSE*', '.github/ISSUE_TEMPLATE/**']
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runtime versions live only in .tool-versions files. The root file
  # supplies the development default and compatibility lanes; each
  # ci/*/.tool-versions file supplies its own lane. config/config.exs
  # derives its OTP allowlist from the same files.
  toolchain:
    name: Read runtime toolchains
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      elixir: ${{ steps.versions.outputs.elixir }}
      otp: ${{ steps.versions.outputs.otp }}
      beam_lanes: ${{ steps.versions.outputs.beam_lanes }}
      test_matrix: ${{ steps.matrix.outputs.test_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Test the version-file parser
        run: sh scripts/toolchain.sh --self-test
      - name: Read defaults and compatibility lanes
        id: versions
        run: sh scripts/toolchain.sh >> "$GITHUB_OUTPUT"
      - name: Compose the default, no-optional and compatibility legs
        id: matrix
        env:
          ELIXIR_VERSION: ${{ steps.versions.outputs.elixir }}
          OTP_VERSION: ${{ steps.versions.outputs.otp }}
          BEAM_LANES: ${{ steps.versions.outputs.beam_lanes }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          default = {"elixir": os.environ["ELIXIR_VERSION"], "otp": os.environ["OTP_VERSION"]}
          lanes = [default, {**default, "no_optional": "1"}]
          lanes.extend(json.loads(os.environ["BEAM_LANES"]))
          print("test_matrix=" + json.dumps({"include": lanes}, separators=(",", ":")))
          PY

  # The default and compatibility lanes use the full development dependencies.
  # The no-optional lane proves Oban and Plug are optional (ADR-0004).
  test:
    needs: toolchain
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.toolchain.outputs.test_matrix) }}
    env:
      MIX_ENV: test
      ASH_HOOKS_NO_OPTIONAL: ${{ matrix.no_optional }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            deps
            _build
          key: mix-${{ matrix.elixir }}-${{ matrix.otp }}-noopt-${{ matrix.no_optional }}-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      # Check dependency retirement and advisories.
      # Fresh disclosures can precede registry updates; inspect the published
      # ranges for directly affected dependencies.
      - run: mix hex.audit
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix credo --strict
      - run: mix test
      - name: Assert optional deps never loaded (no-optional leg)
        if: matrix.no_optional == '1'
        run: |
          mix run --no-start -e 'if :code.which(Oban) != :non_existing or :code.which(Plug) != :non_existing, do: (IO.puts("optional dep loaded"); System.halt(1))'

  # A minimal production consumer pins the actual Ash floor, 3.37.2,
  # on Elixir 1.20. Dev/test and optional dependencies cannot mask OTP
  # startup requirements or unavailable APIs in this consumer graph.
  floor:
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Read the floor toolchain
        id: versions
        run: sh scripts/toolchain.sh ci/floor/.tool-versions >> "$GITHUB_OUTPUT"
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          elixir-version: ${{ steps.versions.outputs.elixir }}
          otp-version: ${{ steps.versions.outputs.otp }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            deps
            _build
          key: mix-floor-${{ steps.versions.outputs.elixir }}-${{ steps.versions.outputs.otp }}-${{ hashFiles('mix.exs') }}
      - run: rm mix.lock
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix test
      - run: env ASH_HOOKS_MINIMUM_ASH=1 scripts/check-consumer.sh

  # Qualify real PostgreSQL consumers, persisted workers, and delivery.
  # ASH_HOOKS_POSTGRES=1 enables the PostgreSQL resources.
  # Ordinary development uses SQLite.
  postgres:
    needs: toolchain
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # postgres:16-alpine
          - postgres: "16"
            image: postgres:16-alpine@sha256:81e77a4833487b8132fe4b00bedd39dc3f74b8641e387f19312a48f7de218c2e
          # postgres:17-alpine
          - postgres: "17"
            image: postgres:17-alpine@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
          # postgres:18-alpine
          - postgres: "18"
            image: postgres:18-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
    env:
      MIX_ENV: test
      ASH_HOOKS_POSTGRES: "1"
      ASH_HOOKS_TEST_PG_HOST: localhost
      ASH_HOOKS_TEST_PG_PORT: "5432"
      ASH_HOOKS_TEST_PG_USER: postgres
      ASH_HOOKS_TEST_PG_PASSWORD: postgres
      ASH_HOOKS_TEST_PG_DATABASE: ash_hooks_test
      ASH_HOOKS_REAL_RECEIVER_PORT: "52871"
    services:
      postgres:
        image: ${{ matrix.image }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ash_hooks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      receiver:
        image: ghcr.io/tarampampam/webhook-tester@sha256:85818267b450d3d386cad6510c561e09b974183ed2832c373bc83b125fc1b221
        env:
          STORAGE_DRIVER: memory
          AUTO_CREATE_SESSIONS: "true"
          MAX_REQUESTS: "1000"
        ports:
          - 52871:8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          elixir-version: ${{ needs.toolchain.outputs.elixir }}
          otp-version: ${{ needs.toolchain.outputs.otp }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            deps
            _build
          key: mix-pg-${{ needs.toolchain.outputs.elixir }}-${{ needs.toolchain.outputs.otp }}-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - run: mix hex.audit
      - run: mix compile --warnings-as-errors
      - name: Wait for the real receiver
        run: curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:52871/api/version
      - name: Coverage gate (100% of the declared Mix surface)
        run: mix test --cover
      - name: Upload coverage HTML on a gate miss
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cover-html-postgres-${{ matrix.postgres }}
          path: cover/

  # Type-check the public API and the consumer worker compiled from test/support.
  # The PostgreSQL suite exercises that same generated worker at runtime.
  dialyzer:
    needs: toolchain
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          elixir-version: ${{ needs.toolchain.outputs.elixir }}
          otp-version: ${{ needs.toolchain.outputs.otp }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            deps
            _build
            ~/.mix
          key: dialyzer-${{ needs.toolchain.outputs.elixir }}-${{ needs.toolchain.outputs.otp }}-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - run: mix dialyzer

  # Verify the package archive and build HexDocs.
  package:
    needs: toolchain
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          elixir-version: ${{ needs.toolchain.outputs.elixir }}
          otp-version: ${{ needs.toolchain.outputs.otp }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            deps
            _build
          key: package-${{ needs.toolchain.outputs.elixir }}-${{ needs.toolchain.outputs.otp }}-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - name: Formatter export and DSL references match the DSL (generated files must not drift)
        run: mix spark.check
      - name: Tarball carries every publish surface
        run: ./scripts/check-package.sh
      - run: mix docs --warnings-as-errors

  # The get-started Livebook, verified headless on one leg: the elixir
  # cells are extracted in order and run outside any mix project
  # (Mix.install requires it) — the same evaluation Livebook performs.
  livebook:
    needs: toolchain
    runs-on: ubuntu-24.04
    services:
      receiver:
        image: ghcr.io/tarampampam/webhook-tester@sha256:85818267b450d3d386cad6510c561e09b974183ed2832c373bc83b125fc1b221
        env:
          STORAGE_DRIVER: memory
          AUTO_CREATE_SESSIONS: "true"
          MAX_REQUESTS: "1000"
        ports:
          - 52871:8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          elixir-version: ${{ needs.toolchain.outputs.elixir }}
          otp-version: ${{ needs.toolchain.outputs.otp }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.mix
            ~/.cache
          key: livebook-mix-${{ needs.toolchain.outputs.elixir }}-${{ needs.toolchain.outputs.otp }}-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - run: ./scripts/check-package.sh
      - name: Wait for the real receiver
        run: curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:52871/api/version
      - name: Run the livebook against the candidate archive (version from mix.exs)
        run: |
          archive="_build/release/ash_hooks-$(grep -m1 '@version' mix.exs | sed -E 's/.*@version "([^"]+)".*/\1/').tar"
          ./scripts/run-livebook.sh documentation/livebooks/get-started.livemd --archive "$archive"

  # Scan the development, declared-floor consumer, and hex-and-git fixture locks.
  # Download OSV's Hex database before scanning offline in a network namespace.
  # No lock data leaves the runner.
  # check-advisories.sh verifies Mix lock encoding and complete entry counts.
  # Unread dependencies and advisories fail closed.
  # hex.audit rejects retired packages.
  security:
    needs: toolchain
    runs-on: ubuntu-24.04
    env:
      OSV_SCANNER_VERSION: "2.7.1"
      OSV_SCANNER_SHA256: fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8
    steps:
      - name: Require Linux (the scan's network namespace)
        run: test "$(uname -s)" = Linux
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          elixir-version: ${{ needs.toolchain.outputs.elixir }}
          otp-version: ${{ needs.toolchain.outputs.otp }}
      - name: Install checksum-pinned osv-scanner
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Download OSV's Hex database (no lock file sent)
        run: |
          db="$RUNNER_TEMP/osv-db"
          mkdir -p "$db/osv-scalibr/Hex"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 \
            -o "$db/osv-scalibr/Hex/all.zip" \
            https://osv-vulnerabilities.storage.googleapis.com/Hex/all.zip
          test -s "$db/osv-scalibr/Hex/all.zip"
          echo "OSV_SCANNER_LOCAL_DB_CACHE_DIRECTORY=$db" >> "$GITHUB_ENV"
      - name: Fetch exactly the locked dependencies
        run: mix deps.get --check-locked
      - name: Retired packages
        run: mix hex.audit
      - name: Advisories in the development, fresh floor consumer and hex-and-git fixture locks
        run: env ASH_HOOKS_MINIMUM_ASH=1 scripts/check-consumer.sh --advisories mix.lock scripts/fixtures/hex-and-git.mix.lock.fixture

  # The single branch-protection check name: require `all-checks-pass`
  # on main and every leg (test matrix, floor, dialyzer, package,
  # postgres, livebook, security) gates through it — no per-job
  # check-name maintenance when the matrix grows.
  all-checks-pass:
    needs: [toolchain, test, floor, postgres, dialyzer, package, livebook, security]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every needed job green
        run: |
          results='${{ toJSON(needs) }}'
          failed=$(printf '%s' "$results" | python3 -c '
          import json, sys
          results = json.load(sys.stdin)
          failed = [name for name, job in results.items() if job["result"] != "success"]
          print(",".join(failed))
          ')
          if [ -n "$failed" ]; then
            echo "failed jobs: $failed" >&2
            exit 1
          fi
          echo "all checks passed"
