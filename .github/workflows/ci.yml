name: CI

# One run qualifies a commit: the candidate is pushed to kci/<sha>, and main
# moves only when `qualified` passes on it. A push to main, a tag, a pull
# request or a dispatch starts no qualification.
on:
  push:
    branches: ['kci/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every run step is bash with -eo pipefail, so a failing command fails its
# step also behind a pipe.
defaults:
  run:
    shell: bash

# Caches are restore-only. A cache saved on a kci/<sha> ref can be restored
# only by that ref, so the one writer is cache-warmer.yml on the default
# branch. Each key names one build: a test lane (on the default lane also the
# PostgreSQL and Dialyzer build, PLTs included), the floor, or dev. The warmer
# builds exactly these keys, on the same paths.

jobs:
  # Runtime versions live only in .tool-versions files. The root file
  # supplies the development default and compatibility lanes; each
  # ci/*/.tool-versions file supplies its own lane. config/config.exs
  # derives its OTP allowlist from the same files.
  toolchain:
    name: Read runtime toolchains
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # the five-minute floor; the slowest cold green was 13s on run 44211163274
    outputs:
      elixir: ${{ steps.toolchain.outputs.elixir }}
      otp: ${{ steps.toolchain.outputs.otp }}
      beam_lanes: ${{ steps.toolchain.outputs.beam_lanes }}
      test_matrix: ${{ steps.toolchain.outputs.test_matrix }}
      postgres_matrix: ${{ steps.postgres.outputs.postgres_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
        id: toolchain
      - name: Test the PostgreSQL lane reader
        run: python3 -I scripts/postgres-lanes.py --self-test
      - name: Read the PostgreSQL lanes
        id: postgres
        run: python3 -I scripts/postgres-lanes.py matrix >> "$GITHUB_OUTPUT"

  # The default and compatibility lanes use the full development dependencies.
  # The no-optional lane proves Oban and Plug are optional (ADR-0004).
  checks:
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 6 # twice the slowest cold green, 158s on run 44213063258
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.toolchain.outputs.test_matrix) }}
    env:
      MIX_ENV: test
      ASH_HOOKS_NO_OPTIONAL: ${{ matrix.no_optional }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/beam
        with:
          elixir: ${{ matrix.elixir }}
          otp: ${{ matrix.otp }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: test-${{ matrix.elixir }}-${{ matrix.otp }}-noopt-${{ matrix.no_optional }}-${{ hashFiles('mix.lock') }}
      - run: mix deps.get --check-locked
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix credo --strict
      - name: Prove the lock byte check rejects an edit admitted by --check-locked
        run: elixir scripts/check-locks.exs --self-test
      - name: Check every committed Mix lock and lock fixture
        run: elixir scripts/check-locks.exs

  test:
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 12 # twice the slowest cold green, 334s on run 44211163274
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.toolchain.outputs.test_matrix) }}
    env:
      MIX_ENV: test
      ASH_HOOKS_NO_OPTIONAL: ${{ matrix.no_optional }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/beam
        with:
          elixir: ${{ matrix.elixir }}
          otp: ${{ matrix.otp }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: test-${{ matrix.elixir }}-${{ matrix.otp }}-noopt-${{ matrix.no_optional }}-${{ hashFiles('mix.lock') }}
      - run: mix deps.get --check-locked
      - run: mix test
      - name: Assert optional deps never loaded (no-optional leg)
        if: matrix.no_optional == '1'
        run: |
          mix run --no-start -e 'if :code.which(Oban) != :non_existing or :code.which(Plug) != :non_existing, do: (IO.puts("optional dep loaded"); System.halt(1))'

  # The suite on the floor toolchain from the committed lock, then a minimal
  # production consumer locked at the actual Ash floor, 3.38.1, on Elixir 1.20.
  # Dev/test and optional dependencies cannot mask OTP startup requirements or
  # unavailable APIs in that consumer graph.
  floor:
    runs-on: ubuntu-24.04
    timeout-minutes: 12 # twice the slowest cold green, 350s on run 44211163274
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the floor toolchain
        id: versions
        run: scripts/toolchain.sh ci/floor/.tool-versions >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/beam
        with:
          elixir: ${{ steps.versions.outputs.elixir }}
          otp: ${{ steps.versions.outputs.otp }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: floor-${{ steps.versions.outputs.elixir }}-${{ steps.versions.outputs.otp }}-${{ hashFiles('mix.lock') }}
      - run: mix deps.get --check-locked
      - run: mix compile --warnings-as-errors
      - run: mix test
      - run: scripts/check-consumer.sh

  # Qualify real PostgreSQL consumers, persisted workers, and delivery.
  # ASH_HOOKS_POSTGRES=1 enables the PostgreSQL resources.
  # Ordinary development uses SQLite.
  postgres:
    name: postgres (${{ matrix.lane }})
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 62 # twice the slowest green, 1841s on run 44211072814
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.toolchain.outputs.postgres_matrix) }}
    env:
      MIX_ENV: test
      ASH_HOOKS_POSTGRES: "1"
      ASH_HOOKS_TEST_PG_HOST: 127.0.0.1
      ASH_HOOKS_TEST_PG_PORT: "5432"
      # Throwaway fixture values, never credentials for an external service.
      ASH_HOOKS_TEST_PG_USER: postgres
      ASH_HOOKS_TEST_PG_PASSWORD: postgres
      ASH_HOOKS_TEST_PG_DATABASE: ash_hooks_test
      ASH_HOOKS_REAL_RECEIVER_PORT: "52871"
    services:
      receiver:
        image: ghcr.io/tarampampam/webhook-tester:2.3.0@sha256:85818267b450d3d386cad6510c561e09b974183ed2832c373bc83b125fc1b221
        env:
          STORAGE_DRIVER: memory
          AUTO_CREATE_SESSIONS: "true"
          MAX_REQUESTS: "1000"
        ports:
          - 52871:8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/beam
        with:
          elixir: ${{ needs.toolchain.outputs.elixir }}
          otp: ${{ needs.toolchain.outputs.otp }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: test-${{ needs.toolchain.outputs.elixir }}-${{ needs.toolchain.outputs.otp }}-noopt--${{ hashFiles('mix.lock') }}
      - name: Start PostgreSQL
        uses: ./.github/actions/postgres
        with:
          lane: ${{ matrix.lane }}
          mode: start
      - run: mix deps.get --check-locked
      - run: mix compile --warnings-as-errors
      - name: Wait for the real receiver
        run: curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:52871/api/version
      - name: Required documentation execution
        run: env ASH_HOOKS_DOCS_REQUIRED=1 ASH_HOOKS_HTTPBUN=1 mix test test/ash_hooks/documentation_examples_test.exs test/ash_hooks/documentation_contract_test.exs test/ash_hooks/confidentiality_test.exs
      - name: Contributor qualification
        run: mix precommit
      - name: Coverage gate (100% of the declared Mix surface)
        run: mix test --cover
      - name: Qualify the exact Ash and Spark floor
        run: env ASH_HOOKS_HTTPBUN=1 elixir scripts/check-ash-floor.exs
      - name: Upload coverage HTML on a gate miss
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cover-html-postgres-${{ matrix.lane }}
          path: cover/
          retention-days: 7
      - name: Stop PostgreSQL
        if: always()
        uses: ./.github/actions/postgres
        with:
          lane: ${{ matrix.lane }}
          mode: stop

  # Type-check the public API and the consumer worker compiled from test/support.
  # The PostgreSQL suite exercises that same generated worker at runtime.
  dialyzer:
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 15 # twice the slowest cold green, 441s on run 44211163274
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/beam
        with:
          elixir: ${{ needs.toolchain.outputs.elixir }}
          otp: ${{ needs.toolchain.outputs.otp }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: test-${{ needs.toolchain.outputs.elixir }}-${{ needs.toolchain.outputs.otp }}-noopt--${{ hashFiles('mix.lock') }}
      - run: mix deps.get --check-locked
      - run: mix dialyzer

  # Verify the package archive and build HexDocs.
  package:
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # the five-minute floor; the slowest cold green was 107s on run 44211163274
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/beam
        with:
          elixir: ${{ needs.toolchain.outputs.elixir }}
          otp: ${{ needs.toolchain.outputs.otp }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: dev-${{ needs.toolchain.outputs.elixir }}-${{ needs.toolchain.outputs.otp }}-${{ hashFiles('mix.lock') }}
      - run: mix deps.get --check-locked
      - name: Regenerate formatter and DSL references
        run: |
          mix format
          mix spark.generate
          git diff --exit-code -- .formatter.exs mix.exs lib test scripts/generate-dsl-docs.exs documentation/dsls
      - name: Upload generated references and formatting on drift
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-references-and-formatting
          path: |
            .formatter.exs
            mix.exs
            lib
            test
            scripts/generate-dsl-docs.exs
            documentation/dsls
          retention-days: 7
      - run: mix spark.check
      - name: Tarball carries every publish surface
        run: ./scripts/check-package.sh
      - name: Verify Hex registry read-back against signed releases
        run: python3 -I test/check_hex_registry_test.py
      - name: Test release metadata validation
        run: python3 -I test/check_release_metadata_test.py
      - run: mix docs --warnings-as-errors
      - name: Read the package version
        id: version
        run: |
          version=$(elixir scripts/read-mix-version.exs mix.exs)
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Name the package, version and commit in the docs
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 -I scripts/stamp-docs-release.py doc --version "$VERSION" --commit "$GITHUB_SHA"
      - run: python3 scripts/check-document-dashes.py --docs doc
      - name: Build and inspect the docs archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          (cd "$RUNNER_TEMP" && mix run --no-mix-exs "$GITHUB_WORKSPACE/scripts/build-docs-archive.exs" \
            "$GITHUB_WORKSPACE/doc" "$RUNNER_TEMP/ash_hooks-docs.tar.gz")
          python3 -I scripts/check-docs-archive.py --version "$VERSION" --commit "$GITHUB_SHA" \
            "$RUNNER_TEMP/ash_hooks-docs.tar.gz" doc

  # The get-started Livebook, verified headless on one leg: the elixir
  # cells are extracted in order and run outside any mix project
  # (Mix.install requires it), the same evaluation Livebook performs.
  livebook:
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 9 # twice the slowest green, 259s on run 43689655434
    services:
      receiver:
        image: ghcr.io/tarampampam/webhook-tester:2.3.0@sha256:85818267b450d3d386cad6510c561e09b974183ed2832c373bc83b125fc1b221
        env:
          STORAGE_DRIVER: memory
          AUTO_CREATE_SESSIONS: "true"
          MAX_REQUESTS: "1000"
        ports:
          - 52871:8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/beam
        with:
          elixir: ${{ needs.toolchain.outputs.elixir }}
          otp: ${{ needs.toolchain.outputs.otp }}
      - run: mix deps.get --check-locked
      - run: ./scripts/check-package.sh
      - name: Wait for the real receiver
        run: curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:52871/api/version
      - name: Run the livebook against the candidate archive (version from mix.exs)
        run: |
          version=$(elixir scripts/read-mix-version.exs mix.exs)
          archive="_build/release/ash_hooks-$version.tar"
          ./scripts/run-livebook.sh documentation/livebooks/get-started.livemd --archive "$archive"

  # Both dependency audits: hex.audit (retirements and the advisories Hex
  # carries) and deps.audit (the Elixir security advisory database). OSV then
  # scans the development, floor consumer and hex-and-git fixture locks offline
  # in a network namespace, so no lock data leaves the runner.
  # check-advisories.sh verifies Mix lock encoding and complete entry counts;
  # unread dependencies and advisories fail closed.
  security:
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # the five-minute floor; the slowest cold green was 116s on run 44213063258
    env:
      OSV_SCANNER_VERSION: "2.7.1"
      OSV_SCANNER_SHA256: fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Require Linux (the scan's network namespace)
        run: test "$(uname -s)" = Linux
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned gitleaks
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Prove the production secret scan rejects a runtime token and accepts clean commits
        run: python3 scripts/check-secrets.py --self-test
      - name: Scan the pushed commit range with the repository rules
        run: python3 scripts/check-secrets.py
      - name: Scan the checked-out head's full history with the repository rules
        run: python3 scripts/check-secrets.py --full-history
      - uses: ./.github/actions/beam
        with:
          elixir: ${{ needs.toolchain.outputs.elixir }}
          otp: ${{ needs.toolchain.outputs.otp }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: dev-${{ needs.toolchain.outputs.elixir }}-${{ needs.toolchain.outputs.otp }}-${{ hashFiles('mix.lock') }}
      - name: Install checksum-pinned osv-scanner
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Download OSV's Hex database (no lock file sent)
        run: |
          db="$RUNNER_TEMP/osv-db"
          mkdir -p "$db/osv-scalibr/Hex"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 \
            -o "$db/osv-scalibr/Hex/all.zip" \
            https://osv-vulnerabilities.storage.googleapis.com/Hex/all.zip
          test -s "$db/osv-scalibr/Hex/all.zip"
          echo "OSV_SCANNER_LOCAL_DB_CACHE_DIRECTORY=$db" >> "$GITHUB_ENV"
      - name: Fetch exactly the locked dependencies
        run: mix deps.get --check-locked
      - name: Retirements and the advisories Hex carries
        run: mix hex.audit
      - name: Fetch exactly the locked floor consumer dependencies
        working-directory: test/consumer
        env:
          MIX_ENV: prod
        run: mix deps.get --check-locked
      - name: Retirements and the advisories Hex carries, floor consumer
        working-directory: test/consumer
        env:
          MIX_ENV: prod
        run: mix hex.audit
      # mix_audit ignores a failed clone or pull of its database and would then
      # pass every graph against no advisories. The clone happens here, where a
      # failure fails the job, and the audit runs only on a populated snapshot.
      - name: Clone the Elixir security advisory database
        run: |
          db="$HOME/.local/share/elixir-security-advisories-mirego"
          git clone --quiet https://github.com/mirego/elixir-security-advisories.git "$db"
          count=$(find "$db/packages" -name '*.yml' -type f | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::The Elixir security advisory database has no advisories."
            exit 1
          fi
          echo "Elixir security advisory database at $(git -C "$db" rev-parse HEAD): $count advisories"
      - name: Advisories in the Elixir security advisory database
        run: |
          mix deps.audit
          mix deps.audit --path test/consumer
          mix deps.audit --path test/floor
      - name: Advisories in every committed lock
        run: scripts/check-advisories.sh mix.lock test/consumer/mix.lock test/floor/mix.lock scripts/fixtures/hex-and-git.mix.lock.fixture

  # The private policy reaches only the scan step, through its environment.
  confidentiality:
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 7 # twice the slowest cold green, 201s on run 44211163274
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/beam
        with:
          elixir: ${{ needs.toolchain.outputs.elixir }}
          otp: ${{ needs.toolchain.outputs.otp }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: dev-${{ needs.toolchain.outputs.elixir }}-${{ needs.toolchain.outputs.otp }}-${{ hashFiles('mix.lock') }}
      - run: mix deps.get --check-locked
      - name: Scan with the private policy
        env:
          PUBLIC_DOCS_DENYLIST: ${{ secrets.PUBLIC_DOCS_DENYLIST }}
        run: ./scripts/check-confidentiality.sh

  # The one required check: green only when every other job is.
  qualified:
    needs: [toolchain, checks, test, floor, postgres, dialyzer, package, livebook, security, confidentiality]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # the five-minute floor; the slowest cold green was 6s on run 44211163274
    steps:
      - name: Require every needed job green
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = json.loads(os.environ["RESULTS"])
          failed = [name for name, job in results.items() if job["result"] != "success"]
          if failed:
              sys.exit("failed jobs: " + ", ".join(failed))
          print("every job passed")
          PY
