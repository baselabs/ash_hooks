name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The matrix tests the supported Elixir window (~> 1.20 in mix.exs) on
  # the OTP releases this project targets: 28 (the dev default, mirrored
  # exactly from .tool-versions) and 29 (current OTP). Lockstep: the
  # window, .tool-versions, this matrix, and the OTP allowlist in
  # config/config.exs move together in ONE commit. Default legs build
  # with the full dev dep set; the no-optional leg proves the package
  # compiles/tests/runs with oban and plug entirely absent (ADR-0004).
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Dev default — mirrors .tool-versions exactly.
          - elixir: "1.20.4"
            otp: "28"
          # Current OTP — the other end of the supported OTP range.
          - elixir: "1.20.4"
            otp: "29"
          # ADR-0004 proof: oban/plug dropped from the dep list entirely —
          # the package must compile, test, and run with neither loaded.
          - elixir: "1.20.4"
            otp: "28"
            no_optional: "1"
    env:
      MIX_ENV: test
      ASH_HOOKS_NO_OPTIONAL: ${{ matrix.no_optional }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            deps
            _build
          key: mix-${{ matrix.elixir }}-${{ matrix.otp }}-noopt-${{ matrix.no_optional }}-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      # CVE discipline: hex.audit runs in CI and after every dependency
      # move (it can lag public advisories by hours — after a fresh
      # disclosure also check OSV/GHSA ranges for directly-consumed
      # packages in the affected family).
      - run: mix hex.audit
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix credo --strict
      - run: mix test
      # the 100% line-coverage GATE (D1/D2, wayfinder #20-#22): every
      # runtime-reachable lib/ line is covered; the ignore list in mix.exs
      # carries only :cover-invisible lines (Spark's generated DSL
      # sections, test-support, four compile-window module-body lines).
      # The code-server purge test reloads its fixture, so :cover.stop
      # collects everything and this step FAILS on a real miss
      - name: Coverage gate (100% of lib/ runtime lines)
        run: mix test --cover
        if: matrix.no_optional != '1' && matrix.otp == '28'
      - name: Upload coverage HTML on a gate miss
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cover-html
          path: cover/
      - name: Assert optional deps never loaded (no-optional leg)
        if: matrix.no_optional == '1'
        run: |
          mix run --no-start -e 'if :code.which(Oban) != :non_existing or :code.which(Plug) != :non_existing, do: (IO.puts("optional dep loaded"); System.halt(1))'

  # The declared Elixir ~> 1.20 minimum, resolved AT THE FLOORS: the lock
  # is dropped so the resolver picks the newest versions whose own floors
  # still admit the minimum — the combination a fresh consumer on the
  # floor actually gets. (History: a 1.15 floor was DISPROVEN here once —
  # modern ash needs the Duration struct from 1.17; 1.17–1.19 support was
  # later retired by owner decision. Never keep a floor this leg
  # disproves.)
  floor:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          elixir-version: "1.20"
          otp-version: "28"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            deps
            _build
          key: mix-floor-1.20-28-${{ hashFiles('mix.exs') }}
      - run: rm mix.lock
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix test

  # CI is Linux-only (owner direction, 2026-09-25): tri-OS developer
  # portability — a developer on macOS, Linux, or Windows can clone,
  # set up, and test — is a code-and-toolchain requirement, not a CI
  # topology. No macos/windows build legs; do not re-add them.

  # Type-check gate on the public API (found the dead IP-SAN matcher on
  # its first run — 2026-08-22).
  dialyzer:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          elixir-version: "1.20.4"
          otp-version: "28"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            deps
            _build
            ~/.mix
          key: dialyzer-1.20.4-28-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - run: mix dialyzer

  # What SHIPS is what was checked: the hex tarball must carry every
  # publish surface (the 0.2.2 usage-rules.md miss was caught
  # post-release; this leg is the mechanical form of that lesson), and
  # hexdocs must build.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          elixir-version: "1.20.4"
          otp-version: "28"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            deps
            _build
          key: package-1.20.4-28-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - name: DSL cheat sheets match the DSL (generated files must not drift)
        run: mix spark.cheat_sheets --check
      - name: Tarball carries every publish surface
        run: |
          env -u ASH_HOOKS_NO_OPTIONAL mix hex.build
          mkdir -p /tmp/tarcheck && tar -xf ash_hooks-*.tar -C /tmp/tarcheck contents.tar.gz
          tar -tzf /tmp/tarcheck/contents.tar.gz | tee /tmp/tar-list.txt
          grep -qx "README.md" /tmp/tar-list.txt
          grep -qx "CHANGELOG.md" /tmp/tar-list.txt
          grep -qx "usage-rules.md" /tmp/tar-list.txt
          grep -qx "UPGRADING.md" /tmp/tar-list.txt
          grep -qx "SECURITY.md" /tmp/tar-list.txt
          grep -qx "LICENSE" /tmp/tar-list.txt
          # documentation/ ships because shipped docs reference it by
          # repo-relative path (UPGRADING.md → tenancy adoption checklist);
          # 1.2.0 published without it and the references went dead in
          # every installed package.
          grep -qx "documentation/tutorials/get-started.md" /tmp/tar-list.txt
          grep -qx "documentation/tutorials/tenancy-adoption-checklist.md" /tmp/tar-list.txt
          grep -qx "documentation/livebooks/get-started.livemd" /tmp/tar-list.txt
          grep -qx "documentation/dsls/DSL-AshHooks.md" /tmp/tar-list.txt
          ! grep -q "DS_Store" /tmp/tar-list.txt
      - run: mix docs

  # The get-started Livebook, verified headless on one leg: the elixir
  # cells are extracted in order and run outside any mix project
  # (Mix.install requires it) — the same evaluation Livebook performs.
  livebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          elixir-version: "1.20.4"
          otp-version: "28"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.mix
            ~/.cache
          key: livebook-mix-${{ hashFiles('mix.lock') }}
      - run: ./scripts/run-livebook.sh documentation/livebooks/get-started.livemd
